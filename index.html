<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>مستشار HR</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --ink:#0f172a; --muted:#6b7a90; --line:#e6ebf2;
    --brand:#0f766e; --on-brand:#fff; --brand-soft:#e6f4f1; --danger:#e11d48;
    --amber:#b45309; --amber-soft:#fef3e2; --ok:#15803d; --ok-soft:#e8f7ee;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{ margin:0; min-height:100dvh; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; font-size:15px; padding-bottom:80px; }
  body.portal-mode{padding-bottom:24px}
  [hidden]{display:none !important}
  .wrap{max-width:600px; margin:0 auto; padding:0 14px}
  
  .app-header{ position:sticky; top:0; z-index:50; background:var(--bg); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top); }
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:12px 0 8px}
  .brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px}
  .logo{width:32px; height:32px; border-radius:10px; background:var(--brand); color:var(--on-brand); display:grid; place-items:center; font-size:13px}
  .icon-btn{border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:10px; padding:6px 12px; font:inherit; font-size:13px; font-weight:700; cursor:pointer}
  
  .switcher{display:flex; gap:8px; padding-bottom:12px}
  .switcher select{flex:1; appearance:none; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 14px; font:inherit; font-weight:700; font-size:14px; color:var(--ink)}
  .add-btn{width:44px; border-radius:12px; border:0; background:var(--brand); color:var(--on-brand); font-size:22px; font-weight:600; cursor:pointer; display:grid; place-items:center}

  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 4px 12px rgba(0,0,0,.03); padding:18px; margin-bottom:12px}
  .hero{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .hero-title{font-size:18px; font-weight:800}
  .hero-badge{background:var(--brand-soft); color:var(--brand); font-weight:800; font-size:13px; padding:6px 12px; border-radius:999px}
  .sec-title{font-size:13px; color:var(--muted); font-weight:700; margin:16px 4px 8px}

  .stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px}
  .stat b{font-size:18px; display:block}
  .stat small{color:var(--muted); font-size:12px}

  .row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0; padding-bottom:0}
  .avatar{width:40px; height:40px; border-radius:12px; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; font-weight:800; flex:none}
  .row-main{flex:1; min-width:0}
  .row-main b{display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row-main small{display:block; color:var(--muted); font-size:12px}

  .btn-sm{background:var(--brand-soft); color:var(--brand); border:0; padding:8px 12px; border-radius:8px; font:inherit; font-size:12px; font-weight:700; cursor:pointer}
  .btn-sm.wa{background:var(--ok-soft); color:var(--ok)}
  .btn-sm.ghost{background:var(--card); border:1px solid var(--line); color:var(--danger)}
  .btn-sm.ok{background:var(--ok); color:#fff}
  .btn-sm.bad{background:var(--danger-soft); color:var(--danger)}

  nav.tabs{position:fixed; bottom:0; left:0; right:0; z-index:50; background:var(--card); border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs button{flex:1; background:none; border:0; padding:10px 2px; color:var(--muted); font:inherit; font-size:10px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer}
  nav.tabs button.active{color:var(--brand)}
  nav.tabs svg{width:22px; height:22px}

  .form{display:grid; gap:12px}
  .form label{display:grid; gap:6px; font-size:12px; font-weight:700; color:var(--muted)}
  .form input, .form select{width:100%; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); font:inherit; font-size:15px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .btn{display:inline-flex; align-items:center; justify-content:center; width:100%; border:0; border-radius:12px; padding:12px; font:inherit; font-weight:700; font-size:15px; cursor:pointer; background:var(--brand); color:var(--on-brand); margin-top:6px}
  .btn:disabled{opacity:.55; pointer-events:none}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}

  .login-wrap{min-height:100dvh; display:grid; place-items:center; padding:24px 16px; background:radial-gradient(120% 80% at 50% 0%, var(--brand-soft) 0%, var(--bg) 55%)}
  .login-card{width:100%; max-width:400px; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:26px 22px}
  .login-card .logo{width:54px; height:54px; border-radius:16px; font-size:17px; margin-bottom:14px}
  .login-card h1{font-size:21px; margin:0 0 4px}
  .err{color:var(--danger); font-size:13px; font-weight:700; min-height:20px; margin-top:6px; text-align:center}
  .text-links{display:flex; justify-content:space-between; margin-top:16px; font-size:13px}
  .text-links a{color:var(--brand); font-weight:700; cursor:pointer; text-decoration:none}

  .modal{position:fixed; inset:0; z-index:100; display:none; align-items:flex-end; justify-content:center; background:rgba(15,23,42,.45); backdrop-filter:blur(2px)}
  .modal.open{display:flex}
  .modal-sheet{background:var(--card); width:100%; max-width:560px; border-radius:20px 20px 0 0; padding:20px; max-height:92vh; overflow:auto; animation:up .22s ease; padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  @keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px}
  .modal-foot{display:flex; gap:10px; margin-top:16px}
  .modal-foot .btn{flex:1}

  .portal-wrap{max-width:480px; margin:0 auto; padding:24px 16px}
  .portal-card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:24px; text-align:center; margin-bottom:14px}
  .portal-logo{width:60px; height:60px; border-radius:16px; background:var(--brand); color:var(--on-brand); display:grid; place-items:center; font-weight:800; font-size:18px; margin:0 auto 16px}
  .portal-card h1{font-size:20px; margin:0 0 4px}
  .portal-card p{color:var(--muted); font-size:14px; margin:0 0 16px}

  .mood-selector{display:flex; justify-content:center; gap:15px; margin:15px 0}
  .mood-btn{font-size:32px; background:none; border:2px solid transparent; border-radius:50%; cursor:pointer; transition:0.2s; padding:5px}
  .mood-btn.selected{border-color:var(--brand); background:var(--brand-soft); transform:scale(1.1)}
</style>
</head>
<body>

<!-- شاشة الدخول -->
<div id="loginScreen" hidden>
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo">HR</div>
      <div id="viewLogin">
        <h1>تسجيل الدخول</h1>
        <form id="loginForm" class="form" style="margin-top:18px">
          <label>البريد الإلكتروني<input id="loginEmail" type="email" required></label>
          <label>كلمة المرور<input id="loginPassword" type="password" required></label>
          <button class="btn" id="loginBtn" type="submit">دخول</button>
          <div class="err" id="loginErr"></div>
        </form>
        <div class="text-links">
          <a onclick="toggleAuthView('register')">إنشاء حساب جديد</a>
        </div>
      </div>

      <div id="viewRegister" hidden>
        <h1>إنشاء حساب</h1>
        <form id="registerForm" class="form" style="margin-top:18px">
          <label>البريد الإلكتروني<input id="regEmail" type="email" required></label>
          <label>كلمة المرور<input id="regPassword" type="password" required minlength="6"></label>
          <button class="btn" id="regBtn" type="submit">تسجيل حساب جديد</button>
          <div class="err" id="regErr"></div>
        </form>
        <div class="text-links" style="justify-content:center">
          <a onclick="toggleAuthView('login')">لديك حساب بالفعل؟</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- واجهة الموظف (البوابة) -->
<div id="portalScreen" hidden>
  <div class="portal-wrap">
    <div class="portal-card">
      <div class="portal-logo">HR</div>
      <h1 id="portalEmpName">جاري التحميل...</h1>
      <p id="portalCompany">...</p>
      <div class="hero-badge" id="portalLeaveBalance" style="margin-top:10px">رصيد الإجازات: ...</div>
    </div>
    
    <div class="card">
      <div class="sec-title">تسجيل الحضور (Pulse Check)</div>
      <div id="portalAttStatus" style="font-size:13px; color:var(--muted); margin-bottom:10px">جاري التحقق من حضورك...</div>
      
      <div id="moodSection">
        <div style="font-size:13px; font-weight:700; text-align:center; color:var(--ink)">كيف تشعر اليوم؟</div>
        <div class="mood-selector">
          <button class="mood-btn" onclick="selectMood('😃', this)">😃</button>
          <button class="mood-btn" onclick="selectMood('😐', this)">😐</button>
          <button class="mood-btn" onclick="selectMood('😡', this)">😡</button>
        </div>
      </div>

      <button class="btn" id="btnPortalCheckIn" onclick="portalCheckIn()">📍 تسجيل حضور اليوم</button>
    </div>

    <div class="card">
      <div class="sec-title">طلب إجازة</div>
      <form id="portalLeaveForm" class="form">
        <label>نوع الإجازة
          <select id="portalLeaveType">
            <option value="سنوية">سنوية</option>
            <option value="مرضية">مرضية</option>
            <option value="طارئة">طارئة</option>
            <option value="بدون راتب">بدون راتب</option>
          </select>
        </label>
        <div class="grid2">
          <label>من تاريخ<input type="date" id="portalLeaveStart" required></label>
          <label>إلى تاريخ<input type="date" id="portalLeaveEnd" required></label>
        </div>
        <button type="submit" class="btn ghost" id="btnPortalLeave">إرسال الطلب للمدير</button>
      </form>
    </div>
  </div>
</div>

<!-- واجهة التوظيف (الرابط السحري) -->
<div id="onboardingScreen" hidden>
  <div class="portal-wrap">
    <div class="portal-card">
      <div class="portal-logo" style="background:var(--brand)">+</div>
      <h1>انضم إلى فريقنا</h1>
      <p>يرجى تعبئة بياناتك لإكمال عملية التوظيف.</p>
    </div>
    <div class="card">
      <form id="onboardingForm" class="form">
        <label>الاسم الكامل *<input id="obName" required></label>
        <label>المسمى الوظيفي *<input id="obJob" required></label>
        <label>رقم الجوال (مع كود الدولة) *<input id="obPhone" required placeholder="مثال: 201012345678"></label>
        <div class="grid2">
          <label>الراتب الأساسي *<input id="obSalary" type="number" required></label>
          <label>رصيد الإجازات<input id="obLeave" type="number" value="21"></label>
        </div>
        <label>تاريخ انتهاء العقد *<input id="obContract" type="date" required></label>
        <button type="submit" class="btn" id="btnObSubmit">إرسال البيانات بنجاح</button>
      </form>
    </div>
  </div>
</div>

<!-- التطبيق (للمستشار) -->
<div id="app" hidden>
  <header class="app-header">
    <div class="wrap">
      <div class="topbar">
        <div class="brand"><div class="logo">HR</div><span>مستشار HR</span></div>
        <button class="icon-btn" id="logoutBtn">خروج</button>
      </div>
      <div class="switcher">
        <select id="companySelect"></select>
        <button class="add-btn" id="addCompanyBtn">+</button>
      </div>
    </div>
  </header>

  <main class="wrap" style="padding-top:16px">
    <section id="view-radar"></section>
    <section id="view-employees" hidden></section>
    <section id="view-attendance" hidden></section>
    <section id="view-leaves" hidden></section>
    <section id="view-payroll" hidden></section>
    <section id="view-compliance" hidden></section>
  </main>

  <nav class="tabs">
    <button data-view="radar" class="active" onclick="switchView('radar')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>الرادار
    </button>
    <button data-view="employees" onclick="switchView('employees')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>الموظفون
    </button>
    <button data-view="attendance" onclick="switchView('attendance')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>الحضور
    </button>
    <button data-view="leaves" onclick="switchView('leaves')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>الإجازات
    </button>
    <button data-view="payroll" onclick="switchView('payroll')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/></svg>الرواتب
    </button>
    <button data-view="compliance" onclick="switchView('compliance')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>الامتثال
    </button>
  </nav>
</div>

<div class="modal" id="modal">
  <div class="modal-sheet">
    <div class="modal-head">
      <h3 id="modalTitle" style="margin:0; font-size:16px"></h3>
      <button class="icon-btn" onclick="closeModal()">إغلاق</button>
    </div>
    <div id="modalBody"></div>
    <div class="modal-foot" id="modalFooter"></div>
  </div>
</div>

<script>
const CONFIG = { SUPABASE_URL: 'https://qdqecfaozbxivlwbinew.supabase.co', SUPABASE_KEY: 'sb_publishable_EK-n56uXsI94eiGWhH25sQ_Toj32Oho' };
const $ = (s) => document.querySelector(s);
const store = {
  get() { try { return JSON.parse(localStorage.getItem('hr_session') || 'null'); } catch { return null; } },
  set(v) { v ? localStorage.setItem('hr_session', JSON.stringify(v)) : localStorage.removeItem('hr_session'); }
};

async function authCall(path, body) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/auth/v1/${path}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': CONFIG.SUPABASE_KEY }, body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error_description || data.msg || 'خطأ');
  return data;
}

async function signIn(email, password) {
  const d = await authCall('token?grant_type=password', { email, password });
  store.set({ access_token: d.access_token, refresh_token: d.refresh_token, user: d.user, expires_at: Date.now() + (d.expires_in || 3600) * 1000 });
  return d.user;
}

async function signUp(email, password) { return await authCall('signup', { email, password }); }

async function refreshSession() {
  const s = store.get();
  const d = await authCall('token?grant_type=refresh_token', { refresh_token: s.refresh_token });
  store.set({ ...s, access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Date.now() + (d.expires_in || 3600) * 1000 });
}

async function api(path, opts = {}, retry = true) {
  const { method = 'GET', body } = opts;
  const s = store.get();
  const isPortal = !s?.access_token || location.search.includes('portal=') || location.search.includes('onboard=');
  const token = isPortal ? CONFIG.SUPABASE_KEY : s.access_token;

  const headers = { 'apikey': CONFIG.SUPABASE_KEY, 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (method !== 'GET') headers['Prefer'] = 'return=representation';

  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
  
  if (res.status === 401 && retry && !isPortal) {
    try { await refreshSession(); } catch { store.set(null); location.reload(); }
    return api(path, opts, false);
  }
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error(data?.message || 'خطأ في قاعدة البيانات');
  return data;
}

async function rpc(fn, args) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { 'apikey': CONFIG.SUPABASE_KEY, 'Authorization': 'Bearer ' + CONFIG.SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || 'خطأ');
  return data;
}

function openModal(title, body, footer) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  $('#modalFooter').innerHTML = footer;
  $('#modal').classList.add('open');
}
function closeModal() { $('#modal').classList.remove('open'); }

const state = { user: null, companies: [], currentCompany: null, employees: [], attendance: [], payrolls: [], leaves: [], compliance: [], view: 'radar', selectedMood: '😐' };
const today = new Date().toISOString().split('T')[0];
const currentMonth = new Date().toISOString().slice(0, 7);

function switchView(view) {
  state.view = view;
  document.querySelectorAll('section[id^="view-"]').forEach(v => v.hidden = true);
  $('#view-' + view).hidden = false;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  
  if (view === 'radar') renderRadar();
  if (view === 'employees') renderEmployees();
  if (view === 'attendance') renderAttendance();
  if (view === 'leaves') renderLeaves();
  if (view === 'payroll') renderPayroll();
  if (view === 'compliance') renderCompliance();
}

function toggleAuthView(view) {
  $('#viewLogin').hidden = view !== 'login';
  $('#viewRegister').hidden = view !== 'register';
}

async function startApp(user) {
  state.user = user;
  $('#loginScreen').hidden = true;
  $('#app').hidden = false;
  document.body.classList.remove('portal-mode');
  
  await loadCompanies();
  if (state.companies.length > 0) {
    selectCompany(state.companies[0].id);
  } else {
    renderSwitcher();
    switchView('radar');
    $('#view-radar').innerHTML = `<div class="card" style="text-align:center; color:var(--muted)">لا توجد شركات.<br>اضغط <b>+</b> لإضافة أول شركة.</div>`;
  }
}

async function loadCompanies() {
  state.companies = await api(`companies?select=*&owner_id=eq.${state.user.id}&order=name.asc`);
}

function renderSwitcher() {
  const sel = $('#companySelect');
  sel.innerHTML = state.companies.length ? state.companies.map(c => `<option value="${c.id}">${c.name}</option>`).join('') : `<option>لا توجد شركات</option>`;
  if (state.currentCompany) sel.value = state.currentCompany.id;
}

async function selectCompany(id) {
  state.currentCompany = state.companies.find(c => c.id === id);
  renderSwitcher();
  await loadData();
  switchView('radar');
}

async function loadData() {
  if (!state.currentCompany) return;
  const cid = state.currentCompany.id;
  const [emps, att, lvs, pay, comp] = await Promise.all([
    api(`employees?select=*&company_id=eq.${cid}&order=full_name.asc`),
    api(`attendance?select=*&company_id=eq.${cid}&work_date=eq.${today}`),
    api(`leave_requests?select=*&company_id=eq.${cid}&order=start_date.desc`),
    api(`payrolls?select=*&company_id=eq.${cid}&month_year=eq.${currentMonth}`),
    api(`compliance?select=*&company_id=eq.${cid}&order=expiry_date.asc`)
  ]);
  state.employees = emps;
  state.attendance = att;
  state.leaves = lvs;
  state.payrolls = pay;
  state.compliance = comp;
  $('#payMonth').value = currentMonth;
}

function renderRadar() {
  const c = state.currentCompany;
  if (!c) return;
  const totalSalary = state.employees.reduce((s, e) => s + (Number(e.base_salary) || 0), 0);
  const pendingLeaves = state.leaves.filter(l => l.status === 'pending').length;
  
  // Mood Check
  const moods = state.attendance.map(a => a.mood).filter(Boolean);
  const happy = moods.filter(m => m === '😃').length;
  const neutral = moods.filter(m => m === '😐').length;
  const angry = moods.filter(m => m === '😡').length;
  
  // Alerts (Contracts & Compliance)
  const todayDate = new Date(today);
  let alertsHtml = '';
  
  state.employees.forEach(e => {
    if(e.contract_end_date) {
      const days = Math.round((new Date(e.contract_end_date) - todayDate) / 864e5);
      if(days <= 30) alertsHtml += `<div class="alert-row"><div class="alert-dot ${days<=7?'bad':'warn'}"></div><div class="alert-main"><b>عقد ${e.full_name}</b><small>ينتهي خلال ${days} يوم</small></div></div>`;
    }
  });
  state.compliance.forEach(c => {
    if(c.expiry_date) {
      const days = Math.round((new Date(c.expiry_date) - todayDate) / 864e5);
      if(days <= 30) alertsHtml += `<div class="alert-row"><div class="alert-dot ${days<=7?'bad':'warn'}"></div><div class="alert-main"><b>${c.title}</b><small>ينتهي خلال ${days} يوم</small></div></div>`;
    }
  });

  $('#view-radar').innerHTML = `
    <div class="card hero">
      <div>
        <div class="hero-title">${c.name}</div>
        <div style="color:var(--muted); font-size:13px">${c.activity_type || 'بدون نشاط'} · ${c.currency}</div>
      </div>
      <div class="hero-badge">${c.currency}</div>
    </div>
    <div class="stats">
      <div class="stat"><b>${state.employees.length}</b><small>الموظفين</small></div>
      <div class="stat"><b>${totalSalary.toLocaleString()}</b><small>إجمالي الأساسي</small></div>
      <div class="stat"><b>${state.attendance.length}</b><small>حضور اليوم</small></div>
      <div class="stat"><b>${pendingLeaves}</b><small>إجازات معلقة</small></div>
    </div>

    ${alertsHtml ? `<div class="sec-title">تنبيهات هامة (30 يوم)</div><div class="card" style="padding:10px 18px">${alertsHtml}</div>` : ''}

    <div class="card">
      <div class="sec-title" style="margin-top:0">مؤشر مشاعر الموظفين اليوم</div>
      ${moods.length ? `<div style="display:flex; justify-content:space-around; text-align:center; margin-top:10px">
        <div><div style="font-size:24px">😃</div><small>${happy}</small></div>
        <div><div style="font-size:24px">😐</div><small>${neutral}</small></div>
        <div><div style="font-size:24px">😡</div><small>${angry}</small></div>
      </div>` : `<div style="color:var(--muted); font-size:12px; text-align:center">لا توجد تقييمات اليوم</div>`}
    </div>
  `;
}

function renderEmployees() {
  if (!state.currentCompany) return;
  $('#view-employees').innerHTML = `
    <div style="display:flex; gap:8px">
      <button class="btn" onclick="openEmployeeForm()" style="flex:2">➕ موظف جديد</button>
      <button class="btn ghost" onclick="generateOnboardLink()" style="flex:1">🔗 رابط التوظيف</button>
    </div>
    <div class="sec-title">قائمة الموظفين (${state.employees.length})</div>
    <div class="card">
      ${state.employees.map(e => `
        <div class="row">
          <div class="avatar">${e.full_name.charAt(0)}</div>
          <div class="row-main">
            <b>${e.full_name}</b>
            <small>${e.job_title || '—'} · ${Number(e.base_salary).toLocaleString()} ${state.currentCompany.currency}</small>
          </div>
          <button class="btn-sm" onclick="copyPortalLink('${e.id}')">بوابة الموظف</button>
        </div>
      `).join('') || '<div style="text-align:center; color:var(--muted)">لا يوجد موظفين</div>'}
    </div>
  `;
}

function copyPortalLink(empId) {
  const base = window.location.origin + window.location.pathname;
  const link = `${base}?portal=${empId}`;
  navigator.clipboard.writeText(link).then(() => alert('تم نسخ رابط البوابة! ابعته للموظف.'));
}

function generateOnboardLink() {
  const base = window.location.origin + window.location.pathname;
  const link = `${base}?onboard=${state.currentCompany.id}`;
  navigator.clipboard.writeText(link).then(() => alert('تم نسخ رابط التوظيف! ابعته للموظف الجديد عشان يكتب بياناته.'));
}

function openEmployeeForm() {
  openModal('إضافة موظف', `
    <form id="empForm" class="form">
      <label>الاسم *<input name="full_name" required></label>
      <label>الوظيفة<input name="job_title"></label>
      <label>الجوال<input name="phone"></label>
      <div class="grid2">
        <label>الراتب الأساسي<input name="base_salary" type="number" required></label>
        <label>الإجازات<input name="annual_leave_balance" type="number" value="21"></label>
      </div>
      <label>انتهاء العقد<input name="contract_end_date" type="date"></label>
    </form>
  `, `<button class="btn ghost" onclick="closeModal()">إلغاء</button><button class="btn" onclick="saveEmployee()">حفظ</button>`);
}

async function saveEmployee() {
  const f = $('#empForm'); if (!f.reportValidity()) return;
  const fd = new FormData(f);
  try {
    await api('employees', { method: 'POST', body: {
      company_id: state.currentCompany.id,
      full_name: fd.get('full_name').trim(),
      job_title: fd.get('job_title').trim(),
      phone: fd.get('phone').trim(),
      base_salary: Number(fd.get('base_salary')),
      annual_leave_balance: Number(fd.get('annual_leave_balance')),
      contract_end_date: fd.get('contract_end_date') || null
    }});
    closeModal(); await loadData(); switchView('employees');
  } catch (e) { alert(e.message); }
}

function renderAttendance() {
  if (!state.currentCompany) return;
  const html = state.employees.map(e => {
    const rec = state.attendance.find(a => a.employee_id === e.id);
    return `
      <div class="row">
        <div class="avatar">${e.full_name.charAt(0)}</div>
        <div class="row-main">
          <b>${e.full_name} ${rec && rec.mood ? rec.mood : ''}</b>
          <small>${rec ? '✅ حاضر' : '❌ غائب'}</small>
        </div>
        <button class="btn-sm ${rec ? 'ghost' : ''}" onclick="toggleAttendance('${e.id}', ${!!rec})">${rec ? 'إلغاء' : 'تسجيل'}</button>
      </div>`;
  }).join('');
  $('#view-attendance').innerHTML = `<div class="sec-title">سجل حضور اليوم (${today})</div><div class="card">${html}</div>`;
}

async function toggleAttendance(empId, isPresent) {
  try {
    if (isPresent) {
      const rec = state.attendance.find(a => a.employee_id === empId);
      if(rec) { await api(`attendance?id=eq.${rec.id}`, { method: 'DELETE' }); state.attendance = state.attendance.filter(a => a.id !== rec.id); }
    } else {
      const res = await api('attendance', { method: 'POST', body: { company_id: state.currentCompany.id, employee_id: empId, work_date: today, check_in: new Date().toISOString(), work_mode: 'office', mood: '😐' }});
      if (res) state.attendance.push(res[0]);
    }
  } catch (error) { alert(error.message); }
  renderAttendance(); renderRadar();
}

function renderLeaves() {
  if (!state.currentCompany) return;
  const html = state.leaves.map(l => {
    const emp = state.employees.find(e => e.id === l.employee_id);
    return `
      <div class="row" style="flex-wrap:wrap">
        <div class="avatar">${emp?emp.full_name.charAt(0):'?'}</div>
        <div class="row-main">
          <b>${emp?emp.full_name:'—'} (${l.leave_type})</b>
          <small>${l.start_date} إلى ${l.end_date}</small>
        </div>
        ${l.status === 'pending' ? `<div style="width:100%; display:flex; gap:5px; margin-top:8px">
          <button class="btn-sm ok" onclick="setLeave('${l.id}','approved')" style="flex:1">موافقة</button>
          <button class="btn-sm bad" onclick="setLeave('${l.id}','rejected')" style="flex:1">رفض</button>
        </div>` : `<span class="badge ${l.status==='approved'?'ok':'bad'}">${l.status==='approved'?'مقبولة':'مرفوضة'}</span>`}
      </div>`;
  }).join('');
  $('#view-leaves').innerHTML = `<div class="sec-title">طلبات الإجازة</div><div class="card">${html||'لا يوجد طلبات'}</div>`;
}

async function setLeave(id, status) {
  await api(`leave_requests?id=eq.${id}`, { method: 'PATCH', body: { status } });
  await loadData(); renderLeaves(); renderRadar();
}

function renderPayroll() {
  if (!state.currentCompany) return;
  const html = state.payrolls.map(p => {
    const emp = state.employees.find(e => e.id === p.employee_id);
    return `
      <div class="row">
        <div class="avatar">${emp?emp.full_name.charAt(0):'?'}</div>
        <div class="row-main"><b>${emp?emp.full_name:'—'}</b><small>الصافي: ${Number(p.net_salary).toLocaleString()} ${state.currentCompany.currency}</small></div>
        <button class="btn-sm wa" onclick="sendWa('${p.id}')">واتساب</button>
      </div>`;
  }).join('');
  $('#view-payroll').innerHTML = `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center">
        <b>كشف رواتب</b>
        <input type="month" id="payMonth" value="${currentMonth}" style="padding:8px; border-radius:8px; border:1px solid var(--line)">
      </div>
      <button class="btn" id="btnGenPay" style="margin-top:12px">توليد الرواتب</button>
    </div>
    <div class="card">${html||'لم يتم التوليد'}</div>
  `;
  $('#btnGenPay').addEventListener('click', async () => {
    const month = $('#payMonth').value;
    const existing = state.payrolls.map(p => p.employee_id);
    const rows = state.employees.filter(e => !existing.includes(e.id)).map(e => ({
      company_id: state.currentCompany.id, employee_id: e.id, month_year: month, base_salary: e.base_salary, net_salary: e.base_salary
    }));
    if(!rows.length) return alert('كل الرواتب مولدة');
    await api('payrolls', { method: 'POST', body: rows });
    await loadData(); renderPayroll();
  });
}

function sendWa(id) {
  const p = state.payrolls.find(x => x.id === id);
  const emp = state.employees.find(e => e.id === p.employee_id);
  if(!emp.phone) return alert('لا يوجد رقم جوال');
  let phone = emp.phone.replace(/\D/g, '');
  if(phone.startsWith('0')) phone = state.currentCompany.country_code + phone.slice(1);
  const msg = `مرحباً ${emp.full_name}، راتب شهر ${p.month_year}:\nالصافي: ${p.net_salary} ${state.currentCompany.currency}`;
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
}

function renderCompliance() {
  if (!state.currentCompany) return;
  const html = state.compliance.map(c => {
    const days = Math.round((new Date(c.expiry_date) - new Date(today)) / 864e5);
    return `
      <div class="row">
        <div class="avatar">🛡️</div>
        <div class="row-main"><b>${c.title}</b><small>ينتهي: ${c.expiry_date} (${days} يوم)</small></div>
        <button class="btn-sm ghost" onclick="delComp('${c.id}')">حذف</button>
      </div>`;
  }).join('');
  $('#view-compliance').innerHTML = `
    <button class="btn" onclick="openCompForm()">➕ إضافة ترخيص/مستند</button>
    <div class="sec-title">الامتثال والتراخيص</div>
    <div class="card">${html||'لا يوجد تراخيص'}</div>
  `;
}

function openCompForm() {
  openModal('إضافة ترخيص', `
    <form id="compForm" class="form">
      <label>الاسم *<input name="title" required placeholder="السجل التجاري / تأمين طبي"></label>
      <label>تاريخ الانتهاء *<input name="expiry_date" type="date" required></label>
    </form>
  `, `<button class="btn ghost" onclick="closeModal()">إلغاء</button><button class="btn" onclick="saveComp()">حفظ</button>`);
}
async function saveComp() {
  const f = $('#compForm'); if(!f.reportValidity()) return;
  const fd = new FormData(f);
  await api('compliance', { method: 'POST', body: { company_id: state.currentCompany.id, title: fd.get('title'), expiry_date: fd.get('expiry_date') }});
  closeModal(); await loadData(); renderCompliance();
}
async function delComp(id) {
  await api(`compliance?id=eq.${id}`, { method: 'DELETE' });
  await loadData(); renderCompliance();
}

// Company Auth
$('#addCompanyBtn').addEventListener('click', () => {
  openModal('إضافة شركة', `
    <form id="coForm" class="form">
      <label>الاسم *<input name="name" required></label>
      <label>النشاط<input name="activity_type"></label>
      <div class="grid2">
        <label>العملة<input name="currency" value="EGP"></label>
        <label>كود الدولة<input name="country_code" value="20" placeholder="مصر=20، السعودية=966"></label>
      </div>
    </form>
  `, `<button class="btn ghost" onclick="closeModal()">إلغاء</button><button class="btn" onclick="saveCompany()">حفظ</button>`);
});

async function saveCompany() {
  const f = $('#coForm'); if(!f.reportValidity()) return;
  const fd = new FormData(f);
  await api('companies', { method: 'POST', body: {
    name: fd.get('name'), activity_type: fd.get('activity_type'), currency: fd.get('currency'),
    country_code: fd.get('country_code'), owner_id: state.user.id
  }});
  closeModal(); await loadCompanies(); selectCompany(state.companies[0].id);
}

$('#companySelect').addEventListener('change', (e) => selectCompany(e.target.value));
$('#modal').addEventListener('click', (e) => { if(e.target.id === 'modal') closeModal(); });
$('#loginForm').addEventListener('submit', async (e) => { e.preventDefault(); try { await startApp(await signIn($('#loginEmail').value, $('#loginPassword').value)); } catch (err) { $('#loginErr').textContent = err.message; } });
$('#registerForm').addEventListener('submit', async (e) => { e.preventDefault(); try { await signUp($('#regEmail').value, $('#regPassword').value); await startApp(await signIn($('#regEmail').value, $('#regPassword').value)); } catch (err) { $('#regErr').textContent = err.message; } });
$('#logoutBtn').addEventListener('click', () => { store.set(null); location.reload(); });

// Portal & Onboarding
function selectMood(m, btn) { state.selectedMood = m; document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); }

async function initPortal(id) {
  document.body.classList.add('portal-mode');
  $('#loginScreen').hidden = true; $('#app').hidden = true; $('#portalScreen').hidden = false;
  try {
    const data = await rpc('get_employee_portal', { p_id: id });
    if(!data || !data.length) throw new Error('رابط غير صالح');
    const emp = data[0];
    state.currentCompany = { id: emp.company_id, name: emp.company_name, currency: emp.currency };
    $('#portalEmpName').textContent = emp.full_name;
    $('#portalCompany').textContent = emp.company_name;
    $('#portalLeaveBalance').textContent = `رصيد الإجازات: ${emp.annual_leave_balance}`;
    state.portalEmpId = id;
    
    const att = await api(`attendance?select=*&employee_id=eq.${id}&work_date=eq.${today}`);
    if(att && att.length) { $('#portalAttStatus').textContent = '✅ سجلت حضورك اليوم'; $('#btnPortalCheckIn').disabled = true; $('#moodSection').hidden = true; }
  } catch (e) { alert(e.message); window.location.href = location.pathname; }
}
async function portalCheckIn() {
  try {
    await rpc('portal_check_in', { p_emp_id: state.portalEmpId, p_company_id: state.currentCompany.id, p_mood: state.selectedMood });
    $('#portalAttStatus').textContent = '✅ تم تسجيل الحضور'; $('#btnPortalCheckIn').disabled = true; $('#moodSection').hidden = true;
  } catch(e) { alert(e.message); }
}
$('#portalLeaveForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const s = $('#portalLeaveStart').value, en = $('#portalLeaveEnd').value;
  const days = Math.round((new Date(en) - new Date(s)) / 864e5) + 1;
  try {
    await rpc('portal_request_leave', { p_emp_id: state.portalEmpId, p_company_id: state.currentCompany.id, p_type: $('#portalLeaveType').value, p_start: s, p_end: en, p_days: days });
    alert('تم الإرسال!'); $('#portalLeaveForm').reset();
  } catch(e) { alert(e.message); }
});

async function initOnboarding(cid) {
  document.body.classList.add('portal-mode');
  $('#loginScreen').hidden = true; $('#app').hidden = true; $('#onboardingScreen').hidden = false;
  state.currentCompany = { id: cid };
}
$('#onboardingForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const btn = $('#btnObSubmit'); btn.disabled = true; btn.textContent = 'جارٍ...';
  try {
    await rpc('portal_onboard_employee', {
      p_company_id: state.currentCompany.id, p_name: $('#obName').value, p_job: $('#obJob').value,
      p_phone: $('#obPhone').value, p_salary: Number($('#obSalary').value), p_leave: Number($('#obLeave').value),
      p_contract: $('#obContract').value
    });
    alert('✅ تم إرسال بياناتك للمدير بنجاح!'); $('#onboardingForm').reset();
  } catch (err) { alert(err.message); } finally { btn.disabled = false; btn.textContent = 'إرسال البيانات'; }
});

(async function boot() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(console.error);
  const url = new URLSearchParams(location.search);
  if (url.get('portal')) return initPortal(url.get('portal'));
  if (url.get('onboard')) return initOnboarding(url.get('onboard'));
  const s = store.get();
  if (!s?.access_token) return $('#loginScreen').hidden = false;
  if (s.expires_at < Date.now() + 60000) { try { await refreshSession(); } catch { store.set(null); return $('#loginScreen').hidden = false; } }
  startApp(s.user);
})();
</script>
</body>
</html>
