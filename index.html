<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مستشار HR — اختبار الاتصال</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --ink:#0f172a; --muted:#6b7a90; --line:#e6ebf2;
    --brand:#0f766e; --on-brand:#fff; --danger:#e11d48; --ok:#15803d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0; min-height:100dvh;
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px;
    display:grid; place-items:center; padding:24px 16px;
  }
  .card{
    width:100%; max-width:400px; background:var(--card);
    border:1px solid var(--line); border-radius:20px; padding:26px 22px;
    box-shadow:0 10px 30px -18px rgba(16,24,40,.25);
  }
  .logo{
    width:54px; height:54px; border-radius:16px;
    background:var(--brand); color:var(--on-brand);
    display:grid; place-items:center; font-weight:800; font-size:17px;
    margin-bottom:16px;
  }
  h1{font-size:20px; margin:0 0 4px}
  .sub{color:var(--muted); font-size:13px; margin:0 0 18px}
  label{display:grid; gap:6px; margin-bottom:12px; font-size:12.5px; font-weight:700; color:var(--muted)}
  input{
    width:100%; padding:12px; border:1px solid var(--line); border-radius:12px;
    background:var(--card); color:var(--ink); font:inherit; font-size:15px;
  }
  input:focus{outline:2px solid var(--brand); outline-offset:1px; border-color:transparent}
  button{
    width:100%; min-height:46px; padding:12px; border:0; border-radius:12px;
    background:var(--brand); color:var(--on-brand);
    font:inherit; font-weight:700; font-size:15px; cursor:pointer; margin-top:6px;
  }
  button:disabled{opacity:.55; pointer-events:none}
  .err{color:var(--danger); font-size:13px; font-weight:700; min-height:20px; margin-top:8px}
  .ok{color:var(--ok)}
  .info{font-size:14px; line-height:1.7}
  .info b{color:var(--brand)}
  .tag{
    display:inline-block; background:#e6f4f1; color:var(--brand);
    padding:4px 10px; border-radius:999px; font-size:12.5px; font-weight:700; margin-top:8px;
  }
</style>
</head>
<body>

<!-- =============== شاشة الدخول =============== -->
<div class="card" id="loginCard">
  <div class="logo">HR</div>
  <h1>تسجيل الدخول</h1>
  <p class="sub">الخطوة 1: التأكد من الاتصال بقاعدة البيانات</p>

  <form id="loginForm">
    <label>البريد الإلكتروني
      <input id="email" type="email" inputmode="email" autocomplete="email" required placeholder="you@example.com">
    </label>
    <label>كلمة المرور
      <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
    </label>
    <button id="loginBtn" type="submit">دخول</button>
    <div class="err" id="errMsg"></div>
  </form>
</div>

<!-- =============== شاشة النجاح =============== -->
<div class="card" id="appCard" hidden>
  <div class="logo">✓</div>
  <h1>الاتصال شغّال 🎉</h1>
  <p class="sub">تم تسجيل الدخول وقراءة البيانات من Supabase</p>
  <div class="info">
    <div>المستخدم: <b id="userEmail">—</b></div>
    <div>عدد شركاتك: <b id="companiesCount">—</b></div>
    <div id="companiesList" style="margin-top:10px"></div>
  </div>
  <button id="logoutBtn" style="background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:16px">خروج</button>
</div>

<script>
/* ============================================================
   ⚙️  الإعدادات (تم تحديث الرابط بنجاح)
   ============================================================ */
const CONFIG = {
  SUPABASE_URL: 'https://qdqecfaozbxivlwbinew.supabase.co',
  SUPABASE_KEY: 'sb_publishable_EK-n56uXsI94eiGWhH25sQ_Toj32Oho'
};

/* ============================================================
   🪛  أدوات مساعدة
   ============================================================ */
const $ = (s) => document.querySelector(s);

const store = {
  get() { try { return JSON.parse(localStorage.getItem('hr_session') || 'null'); } catch { return null; } },
  set(v) { v ? localStorage.setItem('hr_session', JSON.stringify(v)) : localStorage.removeItem('hr_session'); }
};

async function authCall(path, body) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/auth/v1/${path}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': CONFIG.SUPABASE_KEY },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error_description || data.msg || data.message || 'تعذر إتمام الطلب');
  return data;
}

async function signIn(email, password) {
  const d = await authCall('token?grant_type=password', { email, password });
  store.set({
    access_token: d.access_token,
    refresh_token: d.refresh_token,
    user: d.user,
    expires_at: Date.now() + (d.expires_in || 3600) * 1000
  });
  return d.user;
}

async function refreshSession() {
  const s = store.get();
  if (!s?.refresh_token) throw new Error('NO_SESSION');
  const d = await authCall('token?grant_type=refresh_token', { refresh_token: s.refresh_token });
  store.set({ ...s, access_token: d.access_token, refresh_token: d.refresh_token,
              expires_at: Date.now() + (d.expires_in || 3600) * 1000 });
}

async function signOut() {
  const s = store.get();
  if (s?.access_token) {
    try {
      await fetch(`${CONFIG.SUPABASE_URL}/auth/v1/logout`, {
        method: 'POST',
        headers: { apikey: CONFIG.SUPABASE_KEY, Authorization: 'Bearer ' + s.access_token }
      });
    } catch {}
  }
  store.set(null);
}

/* استدعاء REST — مع تجديد تلقائي للتوكن */
async function api(path, opts = {}, retry = true) {
  const { method = 'GET', body } = opts;
  const s = store.get();
  const token = s?.access_token || CONFIG.SUPABASE_KEY;

  const headers = {
    'apikey': CONFIG.SUPABASE_KEY,
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/json'
  };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (method !== 'GET') headers['Prefer'] = 'return=representation';

  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${path}`, {
    method, headers,
    body: body !== undefined ? JSON.stringify(body) : undefined
  });

  if (res.status === 401 && retry && s) {
    try { await refreshSession(); }
    catch { store.set(null); showLogin(); throw new Error('انتهت الجلسة، سجّل الدخول من جديد'); }
    return api(path, opts, false);
  }

  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error(data?.message || data?.details || data?.hint || 'خطأ في الاتصال بقاعدة البيانات');
  return data;
}

/* ============================================================
   🎬  التطبيق
   ============================================================ */
function showLogin() {
  $('#loginCard').hidden = false;
  $('#appCard').hidden = true;
}

async function showApp(user) {
  $('#loginCard').hidden = true;
  $('#appCard').hidden = false;
  $('#userEmail').textContent = user.email || '—';

  try {
    const companies = await api(`companies?select=*&owner_id=eq.${user.id}&order=name.asc`);
    $('#companiesCount').textContent = companies.length;
    if (companies.length) {
      $('#companiesList').innerHTML = companies
        .map(c => `<div class="tag">${c.name}</div>`)
        .join(' ');
    } else {
      $('#companiesList').innerHTML =
        `<div style="color:var(--muted);font-size:13px">لا توجد شركات بعد — هنضيفها في الخطوة 2</div>`;
    }
  } catch (e) {
    $('#companiesList').innerHTML =
      `<div style="color:var(--danger);font-size:13px">فشل قراءة الشركات: ${e.message}</div>`;
  }
}

/* ---- الدخول ---- */
$('#loginForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = $('#loginBtn');
  const err = $('#errMsg');
  btn.disabled = true; btn.textContent = 'جارٍ الدخول…';
  err.textContent = ''; err.classList.remove('ok');

  try {
    const user = await signIn($('#email').value.trim(), $('#password').value);
    err.textContent = '✓ تم الدخول';
    err.classList.add('ok');
    await showApp(user);
  } catch (e) {
    err.textContent = e.message || 'تعذر تسجيل الدخول';
  } finally {
    btn.disabled = false; btn.textContent = 'دخول';
  }
});

/* ---- الخروج ---- */
$('#logoutBtn').addEventListener('click', async () => {
  await signOut();
  showLogin();
});

/* ---- استئناف الجلسة عند إعادة التحميل ---- */
(async function boot() {
  const s = store.get();
  if (!s?.access_token) return showLogin();
  if (s.expires_at && s.expires_at < Date.now() + 60000) {
    try { await refreshSession(); }
    catch { store.set(null); return showLogin(); }
  }
  showApp(store.get().user);
})();
</script>
</body>
</html>
