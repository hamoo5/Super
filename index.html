<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة التشطيبات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="text-slate-800">

  <!-- شاشة التحميل -->
  <div id="loading-screen" class="fixed inset-0 bg-white flex items-center justify-center z-50">
    <div class="text-center">
      <div class="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
      <p class="font-bold text-slate-600">جاري التحميل...</p>
    </div>
  </div>

  <!-- شاشة تسجيل الدخول والإنشاء -->
  <div id="auth-screen" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 border border-slate-100">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-gradient-to-br from-amber-400 to-amber-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-black mb-4">ت</div>
        <h1 class="text-2xl font-bold text-slate-800">نظام التشطيبات</h1>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-bold mb-1">الاسم بالكامل (للحساب الجديد)</label>
          <input type="text" id="fullName" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-amber-500" placeholder="اسمك الثلاثي">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">رقم الموبايل</label>
          <input type="tel" id="phone" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-amber-500 text-right dir-ltr" placeholder="01xxxxxxxxx">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">كلمة المرور</label>
          <input type="password" id="password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-amber-500 text-right dir-ltr" placeholder="••••••••">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">الرقم السري للاستعادة (4 أرقام)</label>
          <input type="text" id="pin" maxlength="4" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-amber-500 text-right dir-ltr" placeholder="مثال: 1234">
        </div>
        
        <div id="auth-error" class="text-red-500 text-sm font-bold hidden text-center bg-red-50 p-2 rounded-lg"></div>

        <button id="loginBtn" onclick="handleLogin()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition">تسجيل الدخول</button>
        <button id="signupBtn" onclick="handleSignup()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-3 rounded-xl transition">إنشاء حساب جديد</button>
        
        <div class="text-center mt-4">
          <button onclick="showScreen('forgot-screen')" class="text-amber-600 text-sm font-bold hover:underline">نسيت كلمة المرور؟</button>
        </div>
      </div>
    </div>
  </div>

  <!-- شاشة نسيت كلمة المرور -->
  <div id="forgot-screen" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 border border-slate-100">
      <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-slate-800">استعادة كلمة المرور</h2>
        <p class="text-slate-500 text-sm mt-1">أدخل رقمك والرقم السري الذي اخترته سابقاً</p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-bold mb-1">رقم الموبايل</label>
          <input type="tel" id="resetPhone" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-amber-500 text-right dir-ltr" placeholder="01xxxxxxxxx">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">الرقم السري (PIN)</label>
          <input type="text" id="resetPin" maxlength="4" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-amber-500 text-right dir-ltr" placeholder="1234">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">كلمة المرور الجديدة</label>
          <input type="password" id="resetNewPassword" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-amber-500 text-right dir-ltr" placeholder="••••••••">
        </div>
        
        <div id="forgot-error" class="text-red-500 text-sm font-bold hidden text-center bg-red-50 p-2 rounded-lg"></div>

        <button onclick="handleResetPassword()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-3 rounded-xl transition">تغيير كلمة المرور</button>
        <button onclick="showScreen('auth-screen')" class="w-full text-slate-500 font-bold py-2 hover:bg-slate-50 rounded-xl transition mt-2">رجوع</button>
      </div>
    </div>
  </div>

  <!-- لوحة التحكم -->
  <div id="app-screen" class="hidden min-h-screen pb-20">
    <header class="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-10">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-amber-500 rounded-lg flex items-center justify-center text-white font-bold">ت</div>
        <span class="font-bold text-lg">التشطيبات</span>
      </div>
      <button onclick="handleLogout()" class="text-red-500 text-sm font-bold bg-red-50 px-3 py-1.5 rounded-lg">خروج</button>
    </header>

    <main class="p-4 max-w-2xl mx-auto space-y-6">
      <div id="no-company-section" class="hidden bg-white rounded-2xl shadow-sm p-6 border border-slate-100 text-center">
        <h2 class="text-xl font-bold mb-2">أهلاً بك!</h2>
        <p class="text-slate-500 mb-6">أنشئ شركتك الأولى للبدء.</p>
        <input type="text" id="newCompanyName" class="w-full px-4 py-3 rounded-xl border border-slate-200 mb-3 focus:outline-none focus:border-amber-500" placeholder="اسم شركة التشطيبات">
        <button onclick="handleCreateCompany()" class="w-full bg-amber-500 text-slate-900 font-bold py-3 rounded-xl">إنشاء الشركة</button>
      </div>

      <div id="dashboard-section" class="hidden space-y-4">
        <div class="bg-gradient-to-br from-slate-900 to-slate-800 rounded-2xl p-6 text-white shadow-lg">
          <p class="text-slate-400 text-sm mb-1">مرحباً بك في</p>
          <h2 id="display-company-name" class="text-2xl font-bold mb-4">اسم الشركة</h2>
          <div class="flex items-center gap-2 bg-white/10 w-fit px-3 py-1.5 rounded-lg text-sm">
            <span>دورك:</span>
            <span id="display-role" class="font-bold text-amber-400">مالك</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'ضع_هنا_رابط_المشروع';
    const SUPABASE_ANON_KEY = 'ضع_هنا_المفتاح_anon';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showScreen(screenId) {
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('forgot-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.add('hidden');
      document.getElementById(screenId).classList.remove('hidden');
    }

    function showError(id, msg) {
      const err = document.getElementById(id);
      err.textContent = msg;
      err.classList.remove('hidden');
      setTimeout(() => err.classList.add('hidden'), 5000);
    }

    function phoneToEmail(phone) {
      let cleanPhone = phone.replace(/\D/g, '');
      return cleanPhone + '@app.local';
    }

    async function handleLogin() {
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      if (!phone || !password) return showError('auth-error', 'أدخل رقم الموبايل وكلمة المرور');

      const email = phoneToEmail(phone);
      const btn = document.getElementById('loginBtn');
      btn.textContent = 'جاري الدخول...'; btn.disabled = true;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      btn.textContent = 'تسجيل الدخول'; btn.disabled = false;
      if (error) showError('auth-error', 'رقم الموبايل أو كلمة المرور غير صحيحة');
    }

    async function handleSignup() {
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value;
      const pin = document.getElementById('pin').value;
      
      if (!phone || !password || !fullName || pin.length !== 4) {
        return showError('auth-error', 'أكمل كل البيانات (الرقم السري 4 أرقام)');
      }

      const email = phoneToEmail(phone);
      const btn = document.getElementById('signupBtn');
      btn.textContent = 'جاري الإنشاء...'; btn.disabled = true;

      const { error } = await supabaseClient.auth.signUp({ 
        email, password, options: { data: { full_name: fullName, phone: phone } }
      });

      if (error) {
        showError('auth-error', error.message);
        btn.textContent = 'إنشاء حساب جديد'; btn.disabled = false;
      } else {
        await supabaseClient.auth.signInWithPassword({ email, password });
        // حفظ الـ PIN بعد إنشاء الحساب
        await supabaseClient.rpc('set_recovery_pin', { p_phone: phone, p_pin: pin });
        checkUserMembership();
      }
    }

    async function handleResetPassword() {
      const phone = document.getElementById('resetPhone').value;
      const pin = document.getElementById('resetPin').value;
      const newPassword = document.getElementById('resetNewPassword').value;

      if (!phone || !pin || !newPassword) return showError('forgot-error', 'أكمل كل البيانات');

      const btn = event.target;
      btn.textContent = 'جاري التغيير...'; btn.disabled = true;

      const { error } = await supabaseClient.rpc('reset_password_with_pin', { 
        p_phone: phone, p_pin: pin, p_new_password: newPassword 
      });

      btn.textContent = 'تغيير كلمة المرور'; btn.disabled = false;

      if (error) {
        showError('forgot-error', error.message);
      } else {
        alert('تم تغيير كلمة المرور بنجاح! يمكنك تسجيل الدخول الآن.');
        showScreen('auth-screen');
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
    }

    async function handleCreateCompany() {
      const name = document.getElementById('newCompanyName').value;
      if (!name) return alert('أدخل اسم الشركة');
      const btn = event.target;
      btn.textContent = 'جاري الإنشاء...'; btn.disabled = true;
      const { error } = await supabaseClient.rpc('create_new_company', { p_name: name });
      btn.textContent = 'إنشاء الشركة'; btn.disabled = false;
      if (error) alert('خطأ: ' + error.message);
      else checkUserMembership(); 
    }

    async function checkUserMembership() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) return showScreen('auth-screen');

      const { data: members } = await supabaseClient
        .from('members')
        .select('role, companies(name)')
        .eq('user_id', user.id)
        .eq('is_active', true)
        .limit(1);

      showScreen('app-screen');

      if (!members || members.length === 0) {
        document.getElementById('no-company-section').classList.remove('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
      } else {
        document.getElementById('no-company-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        const roleMap = { 'owner': 'مالك', 'accountant': 'محاسب', 'supervisor': 'مشرف', 'storekeeper': 'أمين مخزن', 'engineer': 'مهندس' };
        document.getElementById('display-company-name').textContent = members[0].companies.name;
        document.getElementById('display-role').textContent = roleMap[members[0].role] || members[0].role;
      }
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session) checkUserMembership();
      else showScreen('auth-screen');
    });

    checkUserMembership();
  </script>
</body>
</html>
