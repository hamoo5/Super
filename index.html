<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة التشطيبات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="text-slate-800">

  <div id="loading-screen" class="fixed inset-0 bg-white flex items-center justify-center z-50">
    <div class="text-center">
      <div class="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
      <p class="font-bold text-slate-600">جاري التحميل...</p>
    </div>
  </div>

  <!-- شاشة تسجيل الدخول / إنشاء حساب -->
  <div id="auth-screen" class="hidden min-h-screen flex items-center justify-center p-4 bg-slate-100">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-gradient-to-br from-amber-400 to-amber-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-black mb-4">ت</div>
        <h1 class="text-2xl font-bold">مرحباً بك</h1>
      </div>
      <div class="space-y-4">
        <div><input type="text" id="fullName" class="w-full px-4 py-3 rounded-xl border focus:border-amber-500" placeholder="الاسم (للحساب الجديد فقط)"></div>
        <div><input type="tel" id="phone" class="w-full px-4 py-3 rounded-xl border focus:border-amber-500 text-right dir-ltr" placeholder="رقم الموبايل"></div>
        <div><input type="password" id="password" class="w-full px-4 py-3 rounded-xl border focus:border-amber-500 text-right dir-ltr" placeholder="كلمة المرور"></div>
        <div><input type="text" id="pin" maxlength="4" class="w-full px-4 py-3 rounded-xl border focus:border-amber-500 text-right dir-ltr" placeholder="الرقم السري (4 أرقام)"></div>
        <div id="auth-error" class="text-red-500 text-sm font-bold hidden text-center bg-red-50 p-2 rounded-lg"></div>
        <button id="loginBtn" onclick="handleLogin()" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl">تسجيل الدخول</button>
        <button id="signupBtn" onclick="handleSignup()" class="w-full bg-amber-500 text-slate-900 font-bold py-3 rounded-xl">إنشاء حساب جديد</button>
        <div class="text-center mt-4"><button onclick="showScreen('forgot-screen')" class="text-amber-600 text-sm font-bold">نسيت كلمة المرور؟</button></div>
      </div>
    </div>
  </div>

  <!-- شاشة الاستعادة -->
  <div id="forgot-screen" class="hidden min-h-screen flex items-center justify-center p-4 bg-slate-100">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
      <h2 class="text-xl font-bold text-center mb-6">استعادة كلمة المرور</h2>
      <div class="space-y-4">
        <input type="tel" id="resetPhone" class="w-full px-4 py-3 rounded-xl border text-right dir-ltr" placeholder="رقم الموبايل">
        <input type="text" id="resetPin" maxlength="4" class="w-full px-4 py-3 rounded-xl border text-right dir-ltr" placeholder="الرقم السري (PIN)">
        <input type="password" id="resetNewPassword" class="w-full px-4 py-3 rounded-xl border text-right dir-ltr" placeholder="كلمة المرور الجديدة">
        <div id="forgot-error" class="text-red-500 text-sm font-bold hidden text-center bg-red-50 p-2 rounded-lg"></div>
        <button onclick="handleResetPassword()" class="w-full bg-amber-500 font-bold py-3 rounded-xl">تغيير كلمة المرور</button>
        <button onclick="showScreen('auth-screen')" class="w-full text-slate-500 font-bold py-2 mt-2">رجوع</button>
      </div>
    </div>
  </div>

  <!-- الشاشة الشاملة (لوحة التحكم) -->
  <div id="app-screen" class="hidden min-h-screen pb-20 bg-slate-50">
    <header class="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-10">
      <div class="flex items-center gap-2"><div class="w-8 h-8 bg-amber-500 rounded-lg flex items-center justify-center text-white font-bold">ت</div><span class="font-bold text-lg">إدارة التشطيبات</span></div>
      <button onclick="handleLogout()" class="text-red-500 text-sm font-bold bg-red-50 px-3 py-1.5 rounded-lg">خروج</button>
    </header>

    <main class="p-4 max-w-2xl mx-auto space-y-6">
      
      <!-- الشاشة الرئيسية (كل الزراير قدامك) -->
      <div id="home-view">
        <div id="no-company-section" class="hidden bg-white rounded-2xl shadow-sm p-6 text-center border">
          <h2 class="text-xl font-bold mb-2">أهلاً بك!</h2><p class="text-slate-500 mb-6">أنشئ شركتك الأولى للبدء.</p>
          <input type="text" id="newCompanyName" class="w-full px-4 py-3 rounded-xl border mb-3" placeholder="اسم شركة التشطيبات">
          <button onclick="handleCreateCompany()" class="w-full bg-amber-500 font-bold py-3 rounded-xl">إنشاء الشركة</button>
        </div>

        <div id="dashboard-section" class="hidden space-y-6">
          <!-- كارت الترحيب -->
          <div class="bg-gradient-to-br from-slate-900 to-slate-800 rounded-2xl p-6 text-white shadow-lg">
            <p class="text-slate-400 text-sm mb-1">مرحباً بك في</p>
            <h2 id="display-company-name" class="text-2xl font-bold">اسم الشركة</h2>
          </div>

          <!-- الزراير الأربعة الكبار -->
          <div class="grid grid-cols-2 gap-4">
            <button onclick="switchView('projects-view')" class="bg-white p-6 rounded-2xl shadow-sm text-center hover:bg-slate-50 border">
              <div class="text-4xl mb-3">🏗️</div><div class="font-bold text-slate-700">المشاريع</div>
            </button>
            
            <button onclick="switchView('expenses-view')" class="bg-white p-6 rounded-2xl shadow-sm text-center hover:bg-slate-50 border">
              <div class="text-4xl mb-3">💸</div><div class="font-bold text-slate-700">المصروفات</div>
            </button>

            <button onclick="switchView('reports-view')" class="bg-white p-6 rounded-2xl shadow-sm text-center hover:bg-slate-50 border">
              <div class="text-4xl mb-3">📝</div><div class="font-bold text-slate-700">التقارير اليومية</div>
            </button>

            <button onclick="switchView('team-view')" class="bg-white p-6 rounded-2xl shadow-sm text-center hover:bg-slate-50 border">
              <div class="text-4xl mb-3">👥</div><div class="font-bold text-slate-700">الفريق</div>
            </button>
          </div>
        </div>
      </div>

      <!-- 1. شاشة المشاريع -->
      <div id="projects-view" class="hidden">
        <div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold">المشاريع</h2><button onclick="switchView('home-view')" class="text-amber-600 text-sm font-bold bg-amber-50 px-3 py-1.5 rounded-lg">رجوع</button></div>
        <div class="bg-white rounded-2xl shadow-sm p-4 border mb-6">
          <h3 class="font-bold mb-3 text-slate-700">إضافة مشروع جديد</h3>
          <div class="space-y-3">
            <input type="text" id="projName" placeholder="اسم المشروع" class="w-full px-4 py-2 rounded-lg border">
            <input type="text" id="projClient" placeholder="اسم العميل" class="w-full px-4 py-2 rounded-lg border">
            <input type="number" id="projBudget" placeholder="الميزانية (جنيه)" class="w-full px-4 py-2 rounded-lg border text-right dir-ltr">
            <button onclick="handleAddProject()" id="addProjBtn" class="w-full bg-slate-900 text-white font-bold py-2.5 rounded-lg">حفظ المشروع</button>
          </div>
        </div>
        <div id="projects-list" class="space-y-3"></div>
      </div>

      <!-- 2. شاشة المصروفات (جديدة) -->
      <div id="expenses-view" class="hidden">
        <div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold">المصروفات</h2><button onclick="switchView('home-view')" class="text-amber-600 text-sm font-bold bg-amber-50 px-3 py-1.5 rounded-lg">رجوع</button></div>
        <div class="bg-white rounded-2xl shadow-sm p-4 border mb-6">
          <h3 class="font-bold mb-3 text-slate-700">تسجيل مصروف جديد</h3>
          <div class="space-y-3">
            <select id="expProject" class="w-full px-4 py-2 rounded-lg border bg-white"></select>
            <input type="number" id="expAmount" placeholder="المبلغ (جنيه)" class="w-full px-4 py-2 rounded-lg border text-right dir-ltr">
            <input type="text" id="expDesc" placeholder="البيان (مثال: أسمنت - 20 شيكارة)" class="w-full px-4 py-2 rounded-lg border">
            <button onclick="handleAddExpense()" id="addExpBtn" class="w-full bg-red-600 text-white font-bold py-2.5 rounded-lg">حفظ المصروف</button>
          </div>
        </div>
        <div id="expenses-list" class="space-y-3"></div>
      </div>

      <!-- 3. شاشة التقارير -->
      <div id="reports-view" class="hidden">
        <div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold">التقارير اليومية</h2><button onclick="switchView('home-view')" class="text-amber-600 text-sm font-bold bg-amber-50 px-3 py-1.5 rounded-lg">رجوع</button></div>
        <div class="bg-white rounded-2xl shadow-sm p-4 border mb-6">
          <h3 class="font-bold mb-3 text-slate-700">إضافة تقرير جديد</h3>
          <div class="space-y-3">
            <select id="reportProject" class="w-full px-4 py-2 rounded-lg border bg-white"></select>
            <textarea id="reportText" rows="3" placeholder="ماذا حدث في الموقع اليوم؟" class="w-full px-4 py-2 rounded-lg border"></textarea>
            <button onclick="handleAddReport()" id="addReportBtn" class="w-full bg-slate-900 text-white font-bold py-2.5 rounded-lg">حفظ التقرير</button>
          </div>
        </div>
        <div id="reports-list" class="space-y-3"></div>
      </div>

      <!-- 4. شاشة الفريق -->
      <div id="team-view" class="hidden">
        <div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold">الفريق</h2><button onclick="switchView('home-view')" class="text-amber-600 text-sm font-bold bg-amber-50 px-3 py-1.5 rounded-lg">رجوع</button></div>
        <div class="bg-white rounded-2xl shadow-sm p-4 border mb-6">
          <h3 class="font-bold mb-3 text-slate-700">دعوة عضو جديد</h3>
          <div class="space-y-3">
            <select id="inviteRole" class="w-full px-4 py-2 rounded-lg border bg-white">
              <option value="engineer">مهندس</option>
              <option value="accountant">محاسب</option>
              <option value="supervisor">مشرف موقع</option>
              <option value="storekeeper">أمين مخزن</option>
            </select>
            <button onclick="handleGenerateInvite()" class="w-full bg-amber-500 text-slate-900 font-bold py-2.5 rounded-lg">إنشاء رابط الدعوة</button>
          </div>
          <div id="invite-link-container" class="hidden mt-4 p-3 bg-green-50 border border-green-200 rounded-lg text-center">
            <p class="text-sm font-bold text-green-800 mb-2">تم إنشاء الرابط! ابعته للموظف:</p>
            <input type="text" id="inviteLink" readonly class="w-full px-2 py-1 text-xs text-center border rounded bg-white mb-2" dir="ltr">
            <button onclick="copyInviteLink()" class="text-xs bg-green-600 text-white px-4 py-1 rounded">نسخ الرابط</button>
          </div>
        </div>
        <div id="team-list" class="space-y-3"></div>
      </div>

    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://qdqecfaozbxivlwbinew.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EK-n56uXsI94eiGWhH25sQ_Toj32Oho';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentCompanyId = null;
    let allProjects = []; 

    function showScreen(screenId) {
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('forgot-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.add('hidden');
      document.getElementById(screenId).classList.remove('hidden');
    }

    function switchView(viewId) {
      document.getElementById('home-view').classList.add('hidden');
      document.getElementById('projects-view').classList.add('hidden');
      document.getElementById('expenses-view').classList.add('hidden');
      document.getElementById('reports-view').classList.add('hidden');
      document.getElementById('team-view').classList.add('hidden');
      document.getElementById(viewId).classList.remove('hidden');
      
      if (viewId === 'projects-view') loadProjects();
      if (viewId === 'expenses-view') loadExpensesView();
      if (viewId === 'reports-view') loadReportsView();
      if (viewId === 'team-view') loadTeam();
    }

    function showError(id, msg) {
      const err = document.getElementById(id);
      err.textContent = msg;
      err.classList.remove('hidden');
      setTimeout(() => err.classList.add('hidden'), 5000);
    }

    function phoneToEmail(phone) { return phone.replace(/\D/g, '') + '@app.local'; }

    async function handleLogin() {
      const email = phoneToEmail(document.getElementById('phone').value);
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      btn.textContent = 'جاري الدخول...'; btn.disabled = true;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      btn.textContent = 'تسجيل الدخول'; btn.disabled = false;
      if (error) showError('auth-error', 'بيانات الدخول غير صحيحة');
    }

    async function handleSignup() {
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value;
      const pin = document.getElementById('pin').value;
      if (!phone || !password || !fullName || pin.length !== 4) return showError('auth-error', 'أكمل كل البيانات (PIN 4 أرقام)');
      
      const email = phoneToEmail(phone);
      const btn = document.getElementById('signupBtn');
      btn.textContent = 'جاري الإنشاء...'; btn.disabled = true;

      const { error } = await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: fullName, phone: phone } } });
      if (error) {
        showError('auth-error', error.message);
        btn.textContent = 'إنشاء حساب جديد'; btn.disabled = false;
      } else {
        await supabaseClient.auth.signInWithPassword({ email, password });
        await supabaseClient.rpc('set_recovery_pin', { p_phone: phone, p_pin: pin });
        checkUserMembership();
      }
    }

    async function handleResetPassword() {
      const phone = document.getElementById('resetPhone').value;
      const pin = document.getElementById('resetPin').value;
      const newPassword = document.getElementById('resetNewPassword').value;
      if (!phone || !pin || !newPassword) return showError('forgot-error', 'أكمل كل البيانات');
      const btn = event.target;
      btn.textContent = 'جاري التغيير...'; btn.disabled = true;
      const { error } = await supabaseClient.rpc('reset_password_with_pin', { p_phone: phone, p_pin: pin, p_new_password: newPassword });
      btn.textContent = 'تغيير كلمة المرور'; btn.disabled = false;
      if (error) showError('forgot-error', error.message);
      else { alert('تم التغيير بنجاح'); showScreen('auth-screen'); }
    }

    async function handleLogout() { await supabaseClient.auth.signOut(); }

    async function handleCreateCompany() {
      const name = document.getElementById('newCompanyName').value;
      if (!name) return alert('أدخل اسم الشركة');
      const btn = event.target;
      btn.textContent = 'جاري الإنشاء...'; btn.disabled = true;
      const { error } = await supabaseClient.rpc('create_new_company', { p_name: name });
      btn.textContent = 'إنشاء الشركة'; btn.disabled = false;
      if (error) alert('خطأ: ' + error.message);
      else checkUserMembership(); 
    }

    async function checkUserMembership() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) return showScreen('auth-screen');

      const { data: members } = await supabaseClient.from('members').select('company_id, companies(name)').eq('user_id', user.id).eq('is_active', true).limit(1);

      showScreen('app-screen');

      if (!members || members.length === 0) {
        document.getElementById('no-company-section').classList.remove('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
      } else {
        currentCompanyId = members[0].company_id;
        document.getElementById('no-company-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        document.getElementById('display-company-name').textContent = members[0].companies.name;
      }
    }

    // --- المشاريع ---
    async function loadProjects() {
      if (!currentCompanyId) return;
      const listEl = document.getElementById('projects-list');
      listEl.innerHTML = `<div class="text-center text-slate-400 py-4 text-sm">جاري التحميل...</div>`;
      const { data, error } = await supabaseClient.from('projects').select('*').eq('company_id', currentCompanyId).order('created_at', { ascending: false });
      if (error) return listEl.innerHTML = `<div class="text-red-500 text-sm text-center">خطأ</div>`;
      if (data.length === 0) return listEl.innerHTML = `<div class="text-center text-slate-400 py-4 text-sm">لا توجد مشاريع.</div>`;
      allProjects = data; 
      listEl.innerHTML = data.map(proj => `
        <div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center">
          <div>
            <h4 class="font-bold text-slate-800">${proj.name}</h4>
            <p class="text-xs text-slate-500 mt-1">العميل: ${proj.client_name || 'غير محدد'}</p>
            <p class="text-xs text-amber-600 font-bold mt-1">الميزانية: ${proj.budget} ج.م</p>
          </div>
          <div class="w-3 h-3 rounded-full ${proj.status === 'active' ? 'bg-green-500' : 'bg-slate-300'}"></div>
        </div>
      `).join('');
    }

    async function handleAddProject() {
      const name = document.getElementById('projName').value;
      const client = document.getElementById('projClient').value;
      const budget = parseFloat(document.getElementById('projBudget').value) || 0;
      if (!name) return alert('أدخل اسم المشروع');
      const btn = document.getElementById('addProjBtn');
      btn.textContent = 'جاري الحفظ...'; btn.disabled = true;
      const { data: { user } } = await supabaseClient.auth.getUser();
      const { error } = await supabaseClient.from('projects').insert([{ company_id: currentCompanyId, name: name, client_name: client, budget: budget, created_by: user.id }]);
      btn.textContent = 'حفظ المشروع'; btn.disabled = false;
      if (error) alert('خطأ: ' + error.message);
      else { document.getElementById('projName').value = ''; document.getElementById('projClient').value = ''; document.getElementById('projBudget').value = ''; loadProjects(); }
    }

    // --- المصروفات ---
    async function loadExpensesView() {
      if (!currentCompanyId) return;
      const projSelect = document.getElementById('expProject');
      if (allProjects.length === 0) {
        const { data } = await supabaseClient.from('projects').select('id, name').eq('company_id', currentCompanyId);
        allProjects = data || [];
      }
      projSelect.innerHTML = allProjects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      if(allProjects.length === 0) projSelect.innerHTML = `<option value="">أضف مشروع أولاً</option>`;

      const listEl = document.getElementById('expenses-list');
      listEl.innerHTML = `<div class="text-center text-slate-400 py-4 text-sm">جاري التحميل...</div>`;
      const { data, error } = await supabaseClient.from('expenses').select(`*, projects(name)`).eq('company_id', currentCompanyId).order('created_at', { ascending: false });
      
      if (error) return listEl.innerHTML = `<div class="text-red-500 text-sm text-center">خطأ</div>`;
      if (data.length === 0) return listEl.innerHTML = `<div class="text-center text-slate-400 py-4 text-sm">لا توجد مصروفات.</div>`;

      listEl.innerHTML = data.map(e => `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center">
          <div>
            <h4 class="font-bold text-slate-800 text-sm">${e.description}</h4>
            <p class="text-xs text-slate-500 mt-1">${e.projects ? e.projects.name : 'محذوف'}</p>
          </div>
          <span class="text-red-500 font-bold text-sm">${e.amount} ج.م</span>
        </div>
      `).join('');
    }

    async function handleAddExpense() {
      const projId = document.getElementById('expProject').value;
      const amount = parseFloat(document.getElementById('expAmount').value);
      const desc = document.getElementById('expDesc').value;
      if (!projId || !amount || !desc) return alert('أكمل بيانات المصروف');
      
      const btn = document.getElementById('addExpBtn');
      btn.textContent = 'جاري الحفظ...'; btn.disabled = true;
      const { data: { user } } = await supabaseClient.auth.getUser();
      const { error } = await supabaseClient.from('expenses').insert([{ company_id: currentCompanyId, project_id: projId, amount: amount, description: desc, created_by: user.id }]);
      btn.textContent = 'حفظ المصروف'; btn.disabled = false;
      if (error) alert('خطأ: ' + error.message);
      else { document.getElementById('expAmount').value = ''; document.getElementById('expDesc').value = ''; loadExpensesView(); }
    }

    // --- التقارير ---
    async function loadReportsView() {
      if (!currentCompanyId) return;
      const projSelect = document.getElementById('reportProject');
      if (allProjects.length === 0) {
        const { data } = await supabaseClient.from('projects').select('id, name').eq('company_id', currentCompanyId);
        allProjects = data || [];
      }
      projSelect.innerHTML = allProjects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      if(allProjects.length === 0) projSelect.innerHTML = `<option value="">أضف مشروع أولاً</option>`;

      const listEl = document.getElementById('reports-list');
      listEl.innerHTML = `<div class="text-center text-slate-400 py-4 text-sm">جاري التحميل...</div>`;
      const { data, error } = await supabaseClient.from('daily_reports').select(`*, projects(name)`).eq('company_id', currentCompanyId).order('created_at', { ascending: false });
      if (error) return listEl.innerHTML = `<div class="text-red-500 text-sm text-center">خطأ</div>`;
      if (data.length === 0) return listEl.innerHTML = `<div class="text-center text-slate-400 py-4 text-sm">لا توجد تقارير.</div>`;

      listEl.innerHTML = data.map(r => `
        <div class="bg-white p-4 rounded-xl shadow-sm border">
          <div class="flex justify-between mb-2">
            <h4 class="font-bold text-slate-800 text-sm">${r.projects ? r.projects.name : 'محذوف'}</h4>
            <span class="text-xs text-slate-400">${new Date(r.created_at).toLocaleDateString('ar-EG')}</span>
          </div>
          <p class="text-sm text-slate-600 bg-slate-50 p-2 rounded-lg">${r.report_text}</p>
        </div>
      `).join('');
    }

    async function handleAddReport() {
      const projId = document.getElementById('reportProject').value;
      const text = document.getElementById('reportText').value;
      if (!projId || !text) return alert('اختر المشروع واكتب التقرير');
      const btn = document.getElementById('addReportBtn');
      btn.textContent = 'جاري الحفظ...'; btn.disabled = true;
      const { data: { user } } = await supabaseClient.auth.getUser();
      const { error } = await supabaseClient.from('daily_reports').insert([{ company_id: currentCompanyId, project_id: projId, user_id: user.id, report_text: text }]);
      btn.textContent = 'حفظ التقرير'; btn.disabled = false;
      if (error) alert('خطأ');
      else { document.getElementById('reportText').value = ''; loadReportsView(); }
    }

    // --- الفريق ---
    async function loadTeam() {
      if (!currentCompanyId) return;
      const listEl = document.getElementById('team-list');
      listEl.innerHTML = `<div class="text-center text-slate-400 py-4 text-sm">جاري التحميل...</div>`;
      const { data, error } = await supabaseClient.from('members').select('role, full_name, email').eq('company_id', currentCompanyId).eq('is_active', true);
      if (error) return listEl.innerHTML = `<div class="text-red-500 text-sm text-center">خطأ</div>`;
      const roleMap = { 'owner': 'مالك', 'accountant': 'محاسب', 'supervisor': 'مشرف', 'storekeeper': 'أمين مخزن', 'engineer': 'مهندس' };
      listEl.innerHTML = data.map(m => `
        <div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center">
          <div><h4 class="font-bold text-slate-800">${m.full_name || 'بدون اسم'}</h4></div>
          <span class="bg-slate-100 text-slate-600 text-xs px-2 py-1 rounded-lg font-bold">${roleMap[m.role]}</span>
        </div>
      `).join('');
    }

    async function handleGenerateInvite() {
      const role = document.getElementById('inviteRole').value;
      const btn = event.target;
      btn.textContent = 'جاري...'; btn.disabled = true;
      const { data: { user } } = await supabaseClient.auth.getUser();
      const { data, error } = await supabaseClient.from('invites').insert([{ company_id: currentCompanyId, role: role, created_by: user.id }]).select().single();
      btn.textContent = 'إنشاء رابط الدعوة'; btn.disabled = false;
      if (error) return alert('خطأ');
      document.getElementById('inviteLink').value = `${window.location.origin}/?invite=${data.token}`;
      document.getElementById('invite-link-container').classList.remove('hidden');
    }

    function copyInviteLink() {
      const copyText = document.getElementById("inviteLink");
      copyText.select(); copyText.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(copyText.value);
      alert("تم النسخ!");
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session) checkUserMembership();
      else showScreen('auth-screen');
    });

    checkUserMembership();
  </script>
</body>
</html>
